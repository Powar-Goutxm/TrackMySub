server:
  port: 8080

spring:
  application:
    name: TrackMySub
  datasource:
    url: jdbc:postgresql://localhost:5432/trackmysub
    username: trackmysub
    password: trackmysub
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:myDefaultSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  alert:
    cron: '0 0 8 * * *'

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
